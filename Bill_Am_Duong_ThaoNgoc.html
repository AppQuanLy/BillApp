            font-weight: bold;
            margin-top: -17px; /* Giữ nguyên thủ thuật kéo chữ ngày lên trên ảnh */
            position: relative;
            z-index: 2;
        }

        /* KHỐI 2: NỘI DUNG Ở GIỮA (Cần padding) */
        .content-section {
            padding: 0 25px;
            min-height: 100px;
        }

        /* Box Tên Khách Hàng */
        .customer-name { 
            font-size: 15pt;
            font-weight: bold;
            margin: 15px 0px -14px 50px;
            background-color: rgb(245 233 223);
            padding: 10px 10px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 2px solid #eabb72;
        }

        /* --- BẢNG DỮ LIỆU --- */
        table { width: 100%; border-collapse: collapse; font-size: 13pt; font-weight: bold; }
        th, td { border: 1px solid #eabb72; padding: 6px; text-align: center; vertical-align: middle; }
        
        th { 
            background-image: linear-gradient(to right, #feeeba, #feeeba);
            color: #1b1b7d; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        td { background-color: rgb(250 249 254); }
        
        tr.total-row { font-weight: bold; font-size: 16pt; }
        
        .text-red { color: #d90000; font-weight: bold; }
        .text-green { color: #00b050; font-weight: bold; }
        .text-bold { font-weight: bold; }
        .text-right { text-align: right; }
        .day-hui-col { width: 25%; text-align: left; }
        .khui-col { width: 10%; }

        /* --- CSS CHO CÁC NÚT BẤM --- */
        .bill-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .bill-controls button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .bill-controls button:hover { transform: translateY(-2px); }
        .download-btn { background-color: #0275d8; } .download-btn:hover { background-color: #025aa5; }
        .copy-btn { background-color: #5bc0de; } .copy-btn:hover { background-color: #31b0d5; }
        .share-btn { background-color: #5cb85c; } .share-btn:hover { background-color: #449d44; }

        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .bill-controls { display: none !important; }
            body { background-color: #fff; padding: 0; margin: 0; }
            .container { box-shadow: none; border: none; margin: auto; padding: 0; }
        }

    <script>
        let billData = {};

        window.onload = function() {
            try {
                const encodedData = window.location.hash.substring(1);
                if (!encodedData) { throw new Error('Không tìm thấy dữ liệu.'); }
                const jsonData = decodeURIComponent(encodedData);
                billData = JSON.parse(jsonData); 
                generateBill(billData);
            } catch (error) {
                document.body.innerHTML = `<h2 style="color: red; text-align: center;">Lỗi!</h2><p style="text-align: center;">${error.message}</p>`;
                console.error("Lỗi:", error);
            }
        };

        function formatCurrency(num) {
            if (typeof num !== 'number' || num === null) return '';
            return num.toLocaleString('vi-VN');
        }

        function generateBill(data) {
            document.querySelector('[data-field="chu_hui_ten"]').textContent = data.chu_hui_ten || '';
            document.querySelector('[data-field="chu_hui_sdt"]').textContent = data.chu_hui_sdt || '';
            document.querySelector('[data-field="ngay_in_bill"]').textContent = data.ngay_in_bill || '';
            document.querySelector('[data-field="hui_vien_ten"]').textContent = data.hui_vien_ten || '';
        
            const thead = document.getElementById('details-thead');
            const tbody = document.getElementById('details-tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';
        
            let tongHuiChet = 0;
            let tongHuiSong = 0;
            let tongLoiLo = 0;
        
            let allDetails = [];
            if (data.details && Array.isArray(data.details)) {
                allDetails = allDetails.concat(data.details);
            }
            if (data.details_2 && Array.isArray(data.details_2)) {
                allDetails = allDetails.concat(data.details_2);
            }
        
            // 1. DÒNG MỚI THÊM: Tự động kiểm tra loại JSON
            const isType2 = allDetails.some(item => item.hasOwnProperty('Tong_chan_song') || item.hasOwnProperty('Tong_chan_chet'));
        
            // 2. PHẦN MỚI THÊM: Vẽ tiêu đề cột linh hoạt
            if (isType2) {
                thead.innerHTML = `
                    <tr>
                        <th>STT</th>
                        <th class="day-hui-col">TÊN DÂY</th>
                        <th>NGÀY KHUI</th>
                        <th>TIỀN HỤI</th>
                        <th class="khui-col">KỲ HẠN</th>
                        <th>KỲ</th>
                        <th>S</th>
                        <th>C</th>
                        <th>HỤI CHẾT</th>
                        <th>HỤI SỐNG</th>
                        <th>LỜI LỖ</th>
                    </tr>
                `;
            } else {
                thead.innerHTML = `
                    <tr>
                        <th>STT</th>
                        <th class="day-hui-col">TÊN DÂY</th>
                        <th>NGÀY KHUI</th>
                        <th>TIỀN HỤI</th>
                        <th class="khui-col">KỲ HẠN</th>
                        <th>KỲ</th>
                        <th>KỲ HỐT</th>
                        <th>HỤI CHẾT</th>
                        <th>HỤI SỐNG</th>
                        <th>LỜI LỖ</th>
                    </tr>
                `;
            }
        
            // 3. DỰNG NỘI DUNG DỮ LIỆU
            if (allDetails.length > 0) {
                allDetails.forEach((item, index) => {
                    const stt = index + 1;
                    const row = document.createElement('tr');
                    
                    let loiLoClass = '';
                    if (item.loi_lo > 0) {
                        loiLoClass = 'text-green';
                    } else if (item.loi_lo < 0) {
                        loiLoClass = 'text-red';
                    }
        
                    if (isType2) {
                        // Nội dung dòng cho JSON 2
                        row.innerHTML = `
                            <td>${stt}</td>
                            <td class="day-hui-col">${item.day_hui || ''}</td>
                            <td>${item.ngay_khui || ''}</td>
                            <td class="text-right">${formatCurrency(item.so_tien)}</td>
                            <td class="khui-col">${item.khui || ''}</td>
                            <td>${item.ky || ''}</td>
                            <td class="text-bold text-green">${item.Tong_chan_song || 0}</td>
                            <td class="text-bold text-red">${item.Tong_chan_chet || 0}</td>
                            <td class="text-right text-red text-bold">${formatCurrency(item.hui_chet)}</td>
                            <td class="text-right text-bold">${formatCurrency(item.hui_song)}</td>
                            <td class="text-right text-bold ${loiLoClass}">${formatCurrency(item.loi_lo)}</td>
                        `;
                    } else {
                        // Nội dung dòng cho JSON 1
                        row.innerHTML = `
                            <td>${stt}</td>
                            <td class="day-hui-col">${item.day_hui || ''}</td>
                            <td>${item.ngay_khui || ''}</td>
                            <td class="text-right">${formatCurrency(item.so_tien)}</td>
                            <td class="khui-col">${item.khui || ''}</td>
                            <td>${item.ky || ''}</td>
                            <td class="text-red">${item.ky_hot || ''}</td>
                            <td class="text-right text-red text-bold">${formatCurrency(item.hui_chet)}</td>
                            <td class="text-right text-bold">${formatCurrency(item.hui_song)}</td>
                            <td class="text-right text-bold ${loiLoClass}">${formatCurrency(item.loi_lo)}</td>
                        `;
                    }
        
                    tbody.appendChild(row);
        
                    tongHuiChet += item.hui_chet || 0;
                    tongHuiSong += item.hui_song || 0;
                    tongLoiLo += item.loi_lo || 0;
                });
            }
        
            // 4. PHẦN MỚI THÊM: Tính số cột gộp (colspan) linh hoạt
            const colspanLabel = isType2 ? 8 : 7;
        
            let tongLoiLoClass = '';
            if(tongLoiLo > 0) tongLoiLoClass = 'text-green';
            if(tongLoiLo < 0) tongLoiLoClass = 'text-red';
        
            const totalRow = document.createElement('tr');
            totalRow.className = 'total-row';
            totalRow.innerHTML = `
                <td colspan="${colspanLabel}" style="background-color: rgba(217, 0, 0, 0.85); color: white;">TỔNG CỘNG</td>
                <td class="text-right text-red">${formatCurrency(tongHuiChet)}</td>
                <td class="text-right">${formatCurrency(tongHuiSong)}</td>
                <td class="text-right ${tongLoiLoClass}">${formatCurrency(tongLoiLo)}</td>
            `;
            tbody.appendChild(totalRow);
        
            const balance = tongHuiSong - tongHuiChet;
            let balanceClass = '';
            if (balance > 0)  balanceClass = 'text-green';
            if (balance < 0)  balanceClass = 'text-red';
        
            const balanceRow = document.createElement('tr');
            balanceRow.className = 'total-row'; 
            balanceRow.innerHTML = `
                <td colspan="${colspanLabel}" style="background-color: rgba(255, 249, 196, 0.85); color: #111;">Cân Bằng Hụi (Âm/Dương)</td>
                <td colspan="2" class="${balanceClass}" style="background-color: rgba(255, 249, 196, 0.85); font-size: 18pt;">${formatCurrency(balance)}</td>
            `;
            tbody.appendChild(balanceRow);
        
            const billElement = document.getElementById('bill-to-capture');
            document.querySelector('.download-btn').addEventListener('click', () => downloadBillAsImage(billElement));
            document.querySelector('.copy-btn').addEventListener('click', () => copyBillAsImage(billElement));
            document.querySelector('.share-btn').addEventListener('click', () => shareBillAsImage(billElement));
        }
        
        async function captureBill(element, callback) {
            const controls = element.querySelector('.bill-controls');
            if (controls) controls.style.display = 'none';
            try {
                const canvas = await html2canvas(element, { scale: 1.5, useCORS: true });
                await callback(canvas);
            } catch (error) {
                console.error('Lỗi khi tạo ảnh:', error);
                alert('Đã có lỗi xảy ra khi tạo ảnh.');
            } finally {
                if (controls) controls.style.display = 'flex';
            }
        }

        function downloadBillAsImage(element) {
            const filename = `BangCanBang_${billData.hui_vien_ten || 'bill'}.png`;
            captureBill(element, canvas => {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        function copyBillAsImage(element) {
            captureBill(element, canvas => {
                canvas.toBlob(blob => {
                    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                    .then(() => alert('Đã sao chép ảnh vào bộ nhớ tạm!'))
                    .catch(err => alert('Lỗi khi copy.'));
                });
            });
        }

        async function shareBillAsImage(element) {
            const filename = `BangCanBang_${billData.hui_vien_ten}.png`;
            const textshare = `Bảng cân bằng hụi của ${billData.hui_vien_ten}.`;
            
            const shareBtn = element.querySelector('.share-btn'); 
            const originalText = shareBtn.textContent; 
            shareBtn.textContent = "⏳ Đang xử lý..."; 
            shareBtn.disabled = true; 

            if (!navigator.share) {
                alert('Trình duyệt không hỗ trợ chức năng này. Vui lòng dùng nút "Tải Bill".');
                shareBtn.textContent = originalText; 
                shareBtn.disabled = false; 
                return;
            }
            
            captureBill(element, async canvas => {
                try {
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    if (!blob) throw new Error("Không tạo được ảnh");
                    const file = new File([blob], filename, { type: 'image/png' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) { 
                        await navigator.share({ title: `Bảng Cân Bằng Hụi`, text: textshare, files: [file] });
                    } else { 
                        alert('Điện thoại này chặn gửi ảnh trực tiếp. Hệ thống tự động TẢI BILL về máy, bạn mở thư viện ảnh để gửi nhé!');
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    }
                } catch (error) { 
                    if (error.name !== 'AbortError' && !error.message.includes('Share API')) {
                        console.log('Lỗi Share:', error); 
                    }
                } finally {
                    shareBtn.textContent = originalText; 
                    shareBtn.disabled = false; 
                }
            });
        }
    </script>
</body>
</html>
