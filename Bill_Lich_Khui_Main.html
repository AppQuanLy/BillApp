<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Khui Hụi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            font-size: 15pt;
            font-weight: bold;
        }
        .container {
            width: 28cm;
            padding: 1cm;
            margin: auto;
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            position: relative;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14pt;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .title-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .title-section h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 34pt;
            color: #0056b3;
            margin: 0;
        }
        .title-section p {
            margin: 5px 0 0;
            font-size: 16pt;
            font-weight: Bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14pt;
        }
        th, td {
            border: 1px solid #adb5bd;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #0056b3;
            font-weight: bold;
            color: #ffffff;
        }
        tr:nth-child(even) td {
            background-color: #f8f9fa;
        }
        .text-right {
            text-align: right;
        }
        .text-left {
            text-align: left;
        }
        .col-day-hui {
            width: 30%;
        }
        .bill-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .bill-controls button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .bill-controls button:hover {
            transform: translateY(-2px);
        }
        .download-btn { background-color: #0275d8; } .download-btn:hover { background-color: #025aa5; }
        .copy-btn { background-color: #5bc0de; } .copy-btn:hover { background-color: #31b0d5; }
        .share-btn { background-color: #5cb85c; } .share-btn:hover { background-color: #449d44; }

        @media print {
            .bill-controls { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container" id="bill-container">
        <div class="header">
            <div class="header-left">Chủ Hụi: <span id="chu-hui-ten"></span></div>
            <div class="header-right">SĐT: <span id="chu-hui-sdt"></span></div>
        </div>
        <div class="title-section">
            <h1>LỊCH KHUI HỤI</h1>
            <p>Ngày: <span id="ngay-in-bill"></span></p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th class="col-day-hui text-left">DÂY HỤI</th>
                    <th>NGÀY KHUI</th>
                    <th>GIỜ ĐẤU</th>
                    <th>KỲ HẠN</th>
                    <th>KỲ</th>
                    <th class="text-right">TIỀN HỤI</th>
                    <th>TRẠNG THÁI</th>
                </tr>
            </thead>
            <tbody id="details-tbody">
            </tbody>
        </table>
        
        <div class="bill-controls">
            <button class="download-btn">Tải Bill</button>
            <button class="copy-btn">Copy Bill</button>
            <button class="share-btn">Gửi Bill</button>
        </div>
    </div>

<script>
    let billData = {};

    // --- 1. CÁC HÀM TIỆN ÍCH PHÂN TÍCH NGÀY CHUẨN XÁC ---

    // Phân tích chuỗi ngày mở hụi hoặc ngày in bill (Ưu tiên DD/MM/YYYY)
    function parseCustomDate(dateStr) {
        if (!dateStr || typeof dateStr !== 'string') return null;
        const clean = dateStr.trim();
        const parts = clean.includes('/') ? clean.split('/') : clean.split('-');
        if (parts.length !== 3) return null;

        let day, month, year;
        if (parts[0].length === 4) {
            // Dạng YYYY-MM-DD
            year = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10) - 1;
            day = parseInt(parts[2], 10);
        } else {
            // Dạng DD/MM/YYYY
            day = parseInt(parts[0], 10);
            month = parseInt(parts[1], 10) - 1;
            year = parseInt(parts[2], 10);
        }
        return { day, month, year };
    }

    // Phân tích danh sách phieu_da_khui từ AppSheet (Thường là dạng MM/DD/YYYY)
    function parseAppSheetDateItem(dateStr) {
        if (!dateStr || typeof dateStr !== 'string') return "";
        const clean = dateStr.trim().replace(/\s+/g, '');
        const parts = clean.split(/[/|-]/).map(Number);
        if (parts.length < 3) return "";

        let day, month, year;
        if (parts[0] > 1000) {
            // YYYY-MM-DD
            year = parts[0]; month = parts[1]; day = parts[2];
        } else {
            // AppSheet List mặc định: MM/DD/YYYY (parts[0] = Tháng, parts[1] = Ngày)
            month = parts[0];
            day = parts[1];
            year = parts[2];

            // Dự phòng nếu người dùng đã định dạng sẵn thành DD/MM/YYYY (tháng > 12)
            if (month > 12 && day <= 12) {
                let temp = month; month = day; day = temp;
            }
        }
        return `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${year}`;
    }

    function formatCurrency(num) {
        return (typeof num === 'number' && num !== null) ? num.toLocaleString('vi-VN') : '';
    }

    // =====================================================================
    // 2. HÀM TÍNH NGÀY KỲ THỨ K (ĐẦY ĐỦ: CỐ ĐỊNH 2 MỐC, 4 THÁNG, THÁNG, NGÀY...)
    // =====================================================================
    function calculateKyDateStr(hui, kyIndex) {
        const parsed = parseCustomDate(hui.ngay_khui);
        if (!parsed) return "";

        const startDay = parsed.day;
        const startMonth = parsed.month + 1; // 1 - 12
        const startYear = parsed.year;

        const kyHanText = (hui.ky_han_text || '').trim();

        // TRƯỜNG HỢP A: CỐ ĐỊNH THÁNG/2 LẦN
        if (kyHanText.includes('Cố định Tháng/2 Lần') || (hui.moc_ngay && hui.moc_ngay.toString().includes(','))) {
            let d1 = parseInt(hui.moc_1, 10) || 0;
            let d2 = parseInt(hui.moc_2, 10) || 0;

            if ((d1 === 0 || d2 === 0) && hui.moc_ngay) {
                let arr = hui.moc_ngay.toString().split(',')
                    .map(n => parseInt(n.trim(), 10))
                    .filter(n => !isNaN(n) && n > 0)
                    .sort((a, b) => a - b);
                if (arr.length >= 2) {
                    d1 = arr[0];
                    d2 = arr[1];
                }
            }

            if (d1 === 0 || d2 === 0) {
                d1 = (startDay <= 15) ? startDay : (startDay - 15);
                d2 = (startDay <= 15) ? (startDay + 15) : startDay;
            }

            if (d1 > d2) { let t = d1; d1 = d2; d2 = t; }

            const startFromD1 = (startDay <= d1);
            let monthsToAdd = startFromD1 ? Math.floor((kyIndex - 1) / 2) : Math.floor(kyIndex / 2);
            let targetDay = startFromD1 
                ? ((kyIndex % 2 === 1) ? d1 : d2)
                : ((kyIndex % 2 === 1) ? d2 : d1);

            const totalMonths = (startMonth - 1) + monthsToAdd;
            const finalYear = startYear + Math.floor(totalMonths / 12);
            const finalMonth = (totalMonths % 12) + 1;

            return `${String(targetDay).padStart(2, '0')}/${String(finalMonth).padStart(2, '0')}/${finalYear}`;
        }

        // TRƯỜNG HỢP B: KỲ HẠN 4 THÁNG HOẶC THÁNG
        let kyHanValue = parseFloat(hui.ky_han_value);
        if (isNaN(kyHanValue) || kyHanValue <= 0) {
            kyHanValue = (kyHanText === "4 Tháng") ? 4 : 1;
        }

        const unit = (hui.ky_han_unit || '').toLowerCase();
        const isMonthType = unit.includes('tháng') || kyHanText.includes('Tháng');

        if (isMonthType) {
            const monthsToAdd = Math.floor((kyIndex - 1) * kyHanValue);
            const totalMonths = (startMonth - 1) + monthsToAdd;
            const finalYear = startYear + Math.floor(totalMonths / 12);
            const finalMonth = (totalMonths % 12) + 1;

            const maxDaysInNewMonth = new Date(finalYear, finalMonth, 0).getDate();
            const safeDay = Math.min(startDay, maxDaysInNewMonth);

            return `${String(safeDay).padStart(2, '0')}/${String(finalMonth).padStart(2, '0')}/${finalYear}`;
        }

        // TRƯỜNG HỢP C: NGÀY, TUẦN
        const daysToAdd = Math.floor((kyIndex - 1) * kyHanValue);
        const targetDate = new Date(startYear, startMonth - 1, startDay + daysToAdd, 12, 0, 0);
        return `${String(targetDate.getDate()).padStart(2, '0')}/${String(targetDate.getMonth() + 1).padStart(2, '0')}/${targetDate.getFullYear()}`;
    }

    // =====================================================================
    // 3. HÀM ĐỐI SOÁT TRẠNG THÁI "ĐÃ KHUI" (KHÔI PHỤC HOÀN TOÀN CHÍNH XÁC)
    // =====================================================================
    function checkDaKhui(targetDateStr, phieuInput) {
        if (!phieuInput) return "";
        if (phieuInput === "Đã Khui") return "Đã Khui";

        const cleanTarget = (targetDateStr || '').trim();
        if (!cleanTarget) return "";

        // Tách chuỗi danh sách ngày khui từ AppSheet
        const rawList = Array.isArray(phieuInput) ? phieuInput : String(phieuInput).split(/[,|\n]/);

        // Đối soát trực tiếp chuỗi ngày
        const matched = rawList.some(item => {
            const strItem = String(item).trim();
            if (!strItem) return false;
            if (strItem === "Đã Khui") return true;

            const formattedDate = parseAppSheetDateItem(strItem);
            return formattedDate === cleanTarget;
        });

        return matched ? "Đã Khui" : "";
    }

    // =====================================================================
    // 4. HÀM HIỂN THỊ LỊCH KHUI
    // =====================================================================
    function generateBill(data) {
        billData = data;
        document.getElementById('chu-hui-ten').textContent = data.chu_hui_ten || '';
        document.getElementById('chu-hui-sdt').textContent = data.chu_hui_sdt || '';
        document.getElementById('ngay-in-bill').textContent = data.ngay_in_bill || '';

        const tbody = document.getElementById('details-tbody');
        const targetDateStr = (data.ngay_in_bill || '').trim();
        const todaysHuis = [];

        if (Array.isArray(data.danh_sach_day_hui)) {
            data.danh_sach_day_hui.forEach(hui => {
                const maxKy = parseInt(hui.so_ky_toi_da) || 0;

                for (let ky = 1; ky <= maxKy; ky++) {
                    const kyDateStr = calculateKyDateStr(hui, ky);

                    if (kyDateStr === targetDateStr) {
                        // Kiểm tra trạng thái đã khui từ phieu_da_khui hoặc trang_thai
                        const trangThaiKhui = checkDaKhui(targetDateStr, hui.phieu_da_khui || hui.trang_thai);

                        todaysHuis.push({
                            ...hui,
                            ky: `${ky}/${maxKy}`,
                            trang_thai: trangThaiKhui
                        });
                        break;
                    }
                }
            });
        }

        // Sắp xếp theo giờ đấu
        todaysHuis.sort((a, b) => (a.gio_dau || '').localeCompare(b.gio_dau || ''));

        // Render ra bảng HTML
        if (todaysHuis.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8">Không có lịch khui hụi trong ngày.</td></tr>`;
        } else {
            tbody.innerHTML = todaysHuis.map((item, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td class="text-left">${item.ten_hui || ''}</td>
                    <td>${item.ngay_khui || ''}</td>
                    <td>${item.gio_dau || ''}</td>
                    <td>${item.ky_han_text || ''}</td>
                    <td>${item.ky}</td>
                    <td class="text-right">${formatCurrency(item.tien_hui)}</td>
                    <td style="${item.trang_thai === 'Đã Khui' ? 'color: red; font-weight: bold;' : ''}">${item.trang_thai || ''}</td>
                </tr>
            `).join('');
        }

        const billEl = document.getElementById('bill-container');
        document.querySelector('.download-btn').onclick = () => downloadBillAsImage(billEl);
        document.querySelector('.copy-btn').onclick = () => copyBillAsImage(billEl);
        document.querySelector('.share-btn').onclick = () => shareBillAsImage(billEl);
    }

    // =====================================================================
    // 5. KHỞI TẠO & CÁC NÚT ĐIỀU KHIỂN
    // =====================================================================
    window.onload = function () {
        try {
            const hash = window.location.hash.substring(1);
            if (!hash) {
                const sampleData = { 
                    "chu_hui_ten": "Lê Minh", 
                    "chu_hui_sdt": "0938338272", 
                    "ngay_in_bill": "25/08/2026", 
                    "danh_sach_day_hui": [
                        { "ten_hui": "TH 100K_Cố định Tháng/2 Lần", "ngay_khui": "09/08/2026", "gio_dau": "11:00", "ky_han_text": "Cố định Tháng/2 Lần", "moc_1": 9, "moc_2": 25, "so_ky_toi_da": 10, "tien_hui": 100000, "phieu_da_khui": "08/09/2026 , 08/25/2026" },
                        { "ten_hui": "TH 1Tr_4 Tháng", "ngay_khui": "25/04/2026", "gio_dau": "14:00", "ky_han_text": "4 Tháng", "ky_han_value": 4, "ky_han_unit": "tháng", "so_ky_toi_da": 5, "tien_hui": 1000000, "phieu_da_khui": "" }
                    ] 
                };
                generateBill(sampleData);
                return;
            }
            generateBill(JSON.parse(decodeURIComponent(hash)));
        } catch (err) {
            document.body.innerHTML = `<h2 style="color:red;text-align:center;">Lỗi dữ liệu!</h2><p style="text-align:center;">${err.message}</p>`;
        }
    };

    async function captureBill(element, callback) {
        const controls = element.querySelector('.bill-controls');
        if (controls) controls.style.display = 'none';
        try {
            const canvas = await html2canvas(element, { scale: 2, useCORS: true });
            await callback(canvas);
        } catch (err) {
            console.error('Lỗi tạo ảnh:', err);
            alert('Đã có lỗi xảy ra khi tạo ảnh.');
        } finally {
            if (controls) controls.style.display = 'flex';
        }
    }

    function downloadBillAsImage(el) {
        const name = `LichKhuiHui_${billData.ngay_in_bill || 'bill'}.png`.replace(/\//g, '-');
        captureBill(el, canvas => {
            const link = document.createElement('a');
            link.download = name;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function copyBillAsImage(el) {
        captureBill(el, canvas => {
            canvas.toBlob(blob => {
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                    .then(() => alert('Đã sao chép ảnh vào bộ nhớ tạm!'))
                    .catch(() => alert('Lỗi khi copy.'));
            });
        });
    }

    async function shareBillAsImage(el) {
        if (!navigator.share) {
            alert('Trình duyệt không hỗ trợ chia sẻ trực tiếp. Hãy dùng nút "Copy Bill".');
            return;
        }
        const name = `LichKhuiHui_${billData.ngay_in_bill || 'bill'}.png`.replace(/\//g, '-');
        captureBill(el, async canvas => {
            try {
                const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                const file = new File([blob], name, { type: 'image/png' });
                await navigator.share({ title: 'Lịch Khui Hụi', text: `Lịch khui hụi ngày ${billData.ngay_in_bill}`, files: [file] });
            } catch (e) { }
        });
    }
</script>
</body>
</html>
