            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 5;
        }
        .img-title-container img {
            width: 100%;
            max-width: 500px;
            height: auto;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            display: block;
            margin: 0 auto -73px auto;
        }
        .img-title-container p {
            margin: -20px 43px 0 auto; /* Kéo nút "Ngày" lên lồng vào hình một chút cho đẹp */
            font-size: 16pt;
            font-weight: bold;
            color: #fcfff9;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            position: relative;
            z-index: 2;
        }

        /* =======================================================
           KHỐI 2: NỘI DUNG Ở GIỮA (Nằm trên nền lặp lại)
           ======================================================= */
        .content-section {
            margin-top: 45px;
            padding: 0px 25px;
            min-height: 150px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 0;
        }
        th, td {
            border: 1px solid #86541a;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #86541a; 
            color: #fcfff9; 
            font-weight: bold;
            text-transform: uppercase;
        }
        td {
            background-color: #ffffffb8; /* Nền ô trắng mờ */
        }
        
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .col-day-hui { width: 35%; }

            bottom: 25px;
            left: 50%;

            gap: 15px;

            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .bill-controls button:hover {
            transform: translateY(-2px);
        }

        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .bill-controls { display: none !important; }
            body { background-color: #fff; padding: 0; margin: 0; }
            .container { box-shadow: none; border: none; margin: auto; padding: 0; }

        if (!dateStr || typeof dateStr !== 'string') return null;
        const clean = dateStr.trim().replace(/\s+/g, '');
        if (!clean) return null;

        // Bóc tách nhanh các số nguyên từ chuỗi (phân cách bởi / hoặc -)
        const parts = clean.split(/[/|-]/).map(Number);
        if (parts.length < 3) return null;

        // Dạng YYYY-MM-DD
        if (clean.includes('-') && parts[0] > 1000) {
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        const [p1, p2, p3] = parts;
        // Nếu là danh sách từ AppSheet JSON -> Định dạng mặc định MM/DD/YYYY
        if (isAppSheetJsonList) return new Date(p3, p1 - 1, p2);
        
        // Ngược lại, ưu tiên chuẩn Việt Nam DD/MM/YYYY
        if (p1 > 12) return new Date(p3, p2 - 1, p1); // p1 là Ngày
        if (p2 > 12) return new Date(p3, p1 - 1, p2); // p2 là Ngày
        return new Date(p3, p2 - 1, p1);
    }

    // So sánh 2 đối tượng Date theo Ngày/Tháng/Năm
    function areDatesEqual(d1, d2) {
        return d1 && d2 &&
            d1.getFullYear() === d2.getFullYear() &&
            d1.getMonth() === d2.getMonth() &&
            d1.getDate() === d2.getDate();
    }

    // Tăng thời gian theo Kỳ hạn
    function addPeriod(startDate, value, unit) {
        const date = new Date(startDate.getTime());
        const num = parseInt(value) || 0;
        if (num === 0) return date;

        if ((unit || '').toLowerCase().includes('tháng')) {
            const origDay = date.getDate();
            date.setDate(1);
            date.setMonth(date.getMonth() + num);
            const maxDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            date.setDate(Math.min(origDay, maxDay));
        } else {
            date.setDate(date.getDate() + num);
        }
        return date;
    }

    function formatCurrency(num) {
        return (typeof num === 'number' && num !== null) ? num.toLocaleString('vi-VN') : '';
    }

    // --- 2. HÀM ĐỐI SOÁT TRẠNG THÁI ĐÃ KHUI (ĐÃ TỐI ƯU CỰC MẠNH) ---
    function checkDaKhui(targetDateStr, phieuInput) {
        if (!phieuInput) return "";
        if (phieuInput === "Đã Khui") return "Đã Khui";

        const targetDate = parseDate(targetDateStr, false);
        if (!targetDate) return "";

        const targetTime = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate()).getTime();

        // Tách danh sách ngày khui
        const rawList = Array.isArray(phieuInput) ? phieuInput : String(phieuInput).split(/[,|\n]/);

        // Chuyển danh sách thành mốc thời gian để tìm kiếm tức thì O(1)
        const matched = rawList.some(item => {
            const d = parseDate(String(item), true);
            return d && new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() === targetTime;
        });

        return matched ? "Đã Khui" : "";
    }

    // --- 3. HÀM XỬ LÝ GIAO DIỆN CHÍNH ---
    function generateBill(data) {
        billData = data;
        document.getElementById('chu-hui-ten').textContent = data.chu_hui_ten || '';
        document.getElementById('chu-hui-sdt').textContent = data.chu_hui_sdt || '';
        document.getElementById('ngay-in-bill').textContent = data.ngay_in_bill || '';

        const tbody = document.getElementById('details-tbody');
        const targetDate = parseDate(data.ngay_in_bill, false);
        const todaysHuis = [];

        if (Array.isArray(data.danh_sach_day_hui)) {
            data.danh_sach_day_hui.forEach(hui => {
                const startDate = parseDate(hui.ngay_khui, false);
                const maxKy = parseInt(hui.so_ky_toi_da) || 0;
                const soNgayKy = parseFloat(hui.ky_han_value) || 1;

                for (let ky = 1; ky <= maxKy; ky++) {
                    const periodsToAdd = Math.floor((ky - 1) * soNgayKy);
                    const currentDate = addPeriod(startDate, periodsToAdd, hui.ky_han_text);

                    if (areDatesEqual(currentDate, targetDate)) {
                        todaysHuis.push({
                            ...hui,
                            ky: `${ky}/${maxKy}`,
                            trang_thai: checkDaKhui(data.ngay_in_bill, hui.phieu_da_khui || hui.trang_thai)
                        });
                        break;
                    }
                }
            });
        }

        // Sắp xếp theo giờ đấu
        todaysHuis.sort((a, b) => (a.gio_dau || '').localeCompare(b.gio_dau || ''));

        // Render ra bảng HTML
        if (todaysHuis.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8">Không có lịch khui hụi trong ngày.</td></tr>`;
        } else {
            tbody.innerHTML = todaysHuis.map((item, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td class="text-left">${item.ten_hui || ''}</td>
                    <td>${item.ngay_khui || ''}</td>
                    <td>${item.gio_dau || ''}</td>
                    <td>${item.ky_han_text || ''}</td>
                    <td>${item.ky}</td>
                    <td class="text-right">${formatCurrency(item.tien_hui)}</td>
                    <td>${item.trang_thai || ''}</td>
                </tr>
            `).join('');
        }

        // Gán sự kiện cho các nút điều khiển
        const billEl = document.getElementById('bill-container');
        document.querySelector('.download-btn').onclick = () => downloadBillAsImage(billEl);
        document.querySelector('.copy-btn').onclick = () => copyBillAsImage(billEl);
        document.querySelector('.share-btn').onclick = () => shareBillAsImage(billEl);
    }

    // --- 4. TẢI DỮ LIỆU BAN ĐẦU & NÚT ĐIỀU KHIỂN ---
    window.onload = function () {
        try {
            const hash = window.location.hash.substring(1);
            if (!hash) {
                const sampleData = { "chu_hui_ten": "Lê Minh", "chu_hui_sdt": "0938338272", "ngay_in_bill": "22/09/2025", "danh_sach_day_hui": [{ "ten_hui": "HH36", "ngay_khui": "22/08/2025", "gio_dau": "15:00", "ky_han_text": "Tháng", "ky_han_value": 1, "so_ky_toi_da": 12, "tien_hui": 5000000, "phieu_da_khui": "09/22/2025" }] };
                generateBill(sampleData);
                return;
            }
            generateBill(JSON.parse(decodeURIComponent(hash)));
        } catch (err) {
            document.body.innerHTML = `<h2 style="color:red;text-align:center;">Lỗi dữ liệu!</h2><p style="text-align:center;">${err.message}</p>`;
        }
    };

    async function captureBill(element, callback) {
        const controls = element.querySelector('.bill-controls');
        if (controls) controls.style.display = 'none';
        try {
            const canvas = await html2canvas(element, { scale: 2, useCORS: true });
            await callback(canvas);
        } catch (err) {
            console.error('Lỗi tạo ảnh:', err);
            alert('Đã có lỗi xảy ra khi tạo ảnh.');
        } finally {
            if (controls) controls.style.display = 'flex';
        }
    }

    function downloadBillAsImage(el) {
        const name = `LichKhuiHui_${billData.ngay_in_bill || 'bill'}.png`.replace(/\//g, '-');
        captureBill(el, canvas => {
            const link = document.createElement('a');
            link.download = name;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function copyBillAsImage(el) {
        captureBill(el, canvas => {
            canvas.toBlob(blob => {
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                    .then(() => alert('Đã sao chép ảnh vào bộ nhớ tạm!'))
                    .catch(() => alert('Lỗi khi copy.'));
            });
        });
    }

    async function shareBillAsImage(el) {
        if (!navigator.share) {
            alert('Trình duyệt không hỗ trợ chia sẻ trực tiếp. Hãy dùng nút "Copy Bill".');
            return;
        }
        const name = `LichKhuiHui_${billData.ngay_in_bill || 'bill'}.png`.replace(/\//g, '-');
        captureBill(el, async canvas => {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            const file = new File([blob], name, { type: 'image/png' });
            try {
                await navigator.share({ title: 'Lịch Khui Hụi', text: `Lịch khui hụi ngày ${billData.ngay_in_bill}`, files: [file] });
            } catch (e) { }
        });
    }
</script>
