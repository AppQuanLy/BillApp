<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Dây Hụi</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            font-size: 16pt;
            color: #000;
        }
        .container {
            width: 28cm;
            padding: 1cm;
            margin: auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            position: relative;
            padding-bottom: 80px; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .title-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .title-section h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 26pt;
            color: #0070c0;
            margin: 0;
        }
        .title-section p {
            margin: 5px 0 0;
            font-size: 12pt;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 10px 5px;
            margin-bottom: 20px;
        }
        .info-item {
            font-size: 12pt;
        }
        .info-item .label {
            font-weight: bold;
            display: inline-block;
            width: 90px;
        }
        .info-item .value {
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-weight: bold;
        }
        th, td {
            border: 1px solid #888;
            padding: 6px 8px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #d9e2f3;
            font-weight: bold;
        }
        .status-cell.dead { background-color: #ff0000; color: white; font-weight: bold; }
        .status-cell.alive { background-color: #00b050; color: white; font-weight: bold; }
        .status-cell.c-status { background-color: #ffcc00; color: #000; font-weight: bold; }
        .total-row td { font-weight: bold; background-color: #f2f2f2; }
        .text-blue { color: #0070c0; }
        .text-red { color: #ff0000; }
        .text-green { color: #00b050; }
        .font-bold { font-weight: bold; }
        
        .bill-controls {
            position: absolute;
            bottom: 1cm;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .bill-controls button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .bill-controls button:hover { transform: translateY(-2px); }
        .download-btn { background-color: #0275d8; } .download-btn:hover { background-color: #025aa5; }
        .copy-btn { background-color: #5bc0de; } .copy-btn:hover { background-color: #31b0d5; }
        .share-btn { background-color: #5cb85c; } .share-btn:hover { background-color: #449d44; }

        @media print {
            .bill-controls { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container" id="bill-to-capture">

        <div class="header">
            <div class="left">
                Chủ Hụi: <span data-field="chu_hui_ten" class="font-bold"></span><br>
                SĐT: <span data-field="chu_hui_sdt" class="font-bold"></span>
            </div>
        </div>
        <div class="title-section">
            <h1>THÔNG TIN DÂY HỤI</h1>
            <p>Ngày: <span data-field="ngay_in_bill"></span></p>
        </div>
        <div class="info-grid">
            <div class="info-item"><span class="label">Dây:</span><span data-field="day_ten" class="value"></span></div>
            <div class="info-item"><span class="label">Kỳ Hạn:</span><span data-field="ky_han_text" class="value text-blue"></span></div>
            <div class="info-item"><span class="label">Thu Thảo</span></div>
            <div class="info-item"><span class="label">Số Kỳ:</span><span data-field="so_ky" class="value"></span></div>
            <div class="info-item"><span class="label">Mãn Kỳ:</span><span data-field="man_ky_du_kien" class="value text-blue"></span></div>
            <div class="info-item"><span data-field="thu_khi_hot" class="value text-red"></span></div>
            <div class="info-item"><span class="label">Ngày Mở:</span><span data-field="ngay_mo" class="value text-blue"></span></div>
            
            <div class="info-item" id="row_tham_san" style="display: none;">
                <span class="label">Thăm Sàn:</span>
                <span data-field="tham_san" class="value text-red"></span>
            </div>
            
            <div class="info-item" id="row_hot_chot" style="display: none;">
                <span class="label">Hốt Cuối:</span>
                <span data-field="hot_chot" class="value text-green"></span>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>TÊN HỤI VIÊN</th>
                    <th>S / C</th>
                    <th>NGÀY</th>
                    <th>KỲ</th>
                    <th>THĂM</th>
                    <th>TIỀN ĐÓNG</th>
                    <th>TIỀN HỐT</th>
                </tr>
            </thead>
            <tbody id="details-tbody">
            </tbody>
        </table>
        
        <div class="bill-controls">
            <button class="download-btn">Tải Bill</button>
            <button class="copy-btn">Copy Bill</button>
            <button class="share-btn">Gửi Bill</button>
        </div>
    </div>

<script>
    let billData = {};

    window.onload = function() {
        try {
            const encodedData = window.location.hash.substring(1);
            if (!encodedData) { throw new Error('Không tìm thấy dữ liệu.'); }
            const jsonData = decodeURIComponent(encodedData);
            billData = JSON.parse(jsonData);

            let arrOld = billData.danh_sach_chan || [];
            let arr1 = billData.danh_sach_chan_1 || [];
            let arr2 = billData.danh_sach_chan_2 || [];
            billData.danh_sach_chan = [...arrOld, ...arr1, ...arr2];

            generateBill(billData);
        } catch (error) {
            document.body.innerHTML = `<h2 style="color: red; text-align: center;">Lỗi tải dữ liệu!</h2><p style="text-align: center;">${error.message}</p>`;
            console.error("Lỗi:", error);
        }
    };

    function formatCurrency(num) {
        if (typeof num !== 'number' || num === null || num === 0) return '';
        return num.toLocaleString('vi-VN');
    }
    
    function formatTotalCurrency(num) {
        if (typeof num !== 'number' || num === null) return '0';
        return num.toLocaleString('vi-VN');
    }

    // =====================================================================
    // HÀM TÍNH LỊCH NGÀY CHUẨN XÁC TUYỆT ĐỐI
    // =====================================================================
    function calculateKyDate(baseDateStr, kyIndex, data) {
        if (!baseDateStr || typeof baseDateStr !== 'string') return "";
        const parts = baseDateStr.trim().split('/');
        if (parts.length !== 3) return baseDateStr;

        const startDay = parseInt(parts[0], 10);
        const startMonth = parseInt(parts[1], 10); // 1 - 12
        const startYear = parseInt(parts[2], 10);

        let d1 = parseInt(data.moc_1, 10) || 0;
        let d2 = parseInt(data.moc_2, 10) || 0;
        const kyHanText = (data.ky_han_text || '').trim();

        // 1. TRƯỜNG HỢP: CỐ ĐỊNH THÁNG/2 LẦN (Khi có moc_1, moc_2)
        if ((d1 > 0 && d2 > 0) || kyHanText.includes('Cố định Tháng/2 Lần')) {
            if (d1 > d2) {
                let temp = d1; d1 = d2; d2 = temp;
            }

            // Nếu dữ liệu thiếu mốc, tự động dùng ngày mở và ngày mở + 15
            if (d1 === 0 || d2 === 0) {
                d1 = startDay;
                d2 = (startDay <= 15) ? (startDay + 15) : (startDay - 15);
                if (d1 > d2) { let t = d1; d1 = d2; d2 = t; }
            }

            let startFromD1 = (startDay <= d1);
            let targetDay = 0;
            let monthsToAdd = 0;

            if (startFromD1) {
                monthsToAdd = Math.floor((kyIndex - 1) / 2);
                targetDay = (kyIndex % 2 === 1) ? d1 : d2;
            } else {
                monthsToAdd = Math.floor(kyIndex / 2);
                targetDay = (kyIndex % 2 === 1) ? d2 : d1;
            }

            // Ghép chuỗi toán học trực tiếp
            let totalMonths = (startMonth - 1) + monthsToAdd;
            let finalYear = startYear + Math.floor(totalMonths / 12);
            let finalMonth = (totalMonths % 12) + 1;

            return `${String(targetDay).padStart(2, '0')}/${String(finalMonth).padStart(2, '0')}/${finalYear}`;
        }

        // 2. TRƯỜNG HỢP: CÁC KỲ HẠN CŨ (NGÀY, TUẦN, THÁNG...)
        const kyHanValue = parseFloat(data.ky_han_value) || 1;
        const periodsToAdd = (kyIndex - 1) * kyHanValue;
        const unit = (data.ky_han_unit || '').toLowerCase();

        let targetDate = new Date(startYear, startMonth - 1, startDay, 12, 0, 0);

        if (unit.includes('tháng') || kyHanText.toLowerCase().includes('tháng')) {
            const originalDay = targetDate.getDate();
            targetDate.setDate(1);
            targetDate.setMonth(targetDate.getMonth() + Math.floor(periodsToAdd));
            const lastDay = new Date(targetDate.getFullYear(), targetDate.getMonth() + 1, 0).getDate();
            targetDate.setDate(Math.min(originalDay, lastDay));
        } else {
            targetDate.setDate(targetDate.getDate() + Math.floor(periodsToAdd));
        }

        const d = String(targetDate.getDate()).padStart(2, '0');
        const m = String(targetDate.getMonth() + 1).padStart(2, '0');
        const y = targetDate.getFullYear();
        return `${d}/${m}/${y}`;
    }

    // =====================================================================
    // HÀM RENDER DỮ LIỆU LÊN BILL
    // =====================================================================
    function generateBill(data) {
        for (const key in data) {
            if (key !== 'danh_sach_chan' && key !== 'danh_sach_chan_1' && key !== 'danh_sach_chan_2' && key !== 'tham_san') {
                const element = document.querySelector(`[data-field="${key}"]`);
                if (element) element.textContent = data[key];
            }
        }
        
        const rowThamSan = document.getElementById('row_tham_san');
        if (data.tham_san && data.tham_san.toString().trim() !== "") {
            const valThamSan = isNaN(data.tham_san) ? data.tham_san : formatCurrency(Number(data.tham_san));
            document.querySelector('[data-field="tham_san"]').textContent = valThamSan;
            rowThamSan.style.display = 'block';
        }

        const rowHotChot = document.getElementById('row_hot_chot');
        if (data.tien_hui && data.tien_hui.toString().trim() !== "") {
            let soKyNum = 0;
            if (data.so_ky || data.so_ky_toi_da) {
                const match = (data.so_ky || data.so_ky_toi_da).toString().match(/\d+/);
                if (match) soKyNum = parseInt(match[0]);
            }
            
            if (soKyNum > 0) {
                const tienHuiNumber = Number(data.tien_hui.toString().replace(/\D/g, ''));
                const giaTriHotChot = tienHuiNumber * (soKyNum - 1);
                
                document.querySelector('[data-field="hot_chot"]').textContent = formatCurrency(giaTriHotChot);
                rowHotChot.style.display = 'block';
            }
        }

        const tbody = document.getElementById('details-tbody');
        tbody.innerHTML = '';
        let tongTham = 0, tongTienHot = 0, tongTienDong = 0;

        if (data.danh_sach_chan && Array.isArray(data.danh_sach_chan)) {
            data.danh_sach_chan.sort((a, b) => {
                const kyA = parseInt(a.ky) || 0;
                const kyB = parseInt(b.ky) || 0;
                const hasKyA = (kyA > 0);
                const hasKyB = (kyB > 0);

                if (hasKyA && !hasKyB) return -1;
                if (!hasKyA && hasKyB) return 1;
                if (hasKyA && hasKyB) return kyA - kyB;
                return 0;
            });

            const ngayMo = data.ngay_mo || data.ngay_khui || "";
            const soKyInt = parseInt(data.so_ky || data.so_ky_toi_da) || 0;

            // 1. TÍNH MÃN KỲ: ƯU TIÊN LẤY TỪ APPSHEET ĐÃ TÍNH TRƯỚC
            const manKyDuKienEl = document.querySelector('[data-field="man_ky_du_kien"]');
            if (manKyDuKienEl) {
                if (data.man_ky_du_kien && data.man_ky_du_kien.trim() !== "") {
                    manKyDuKienEl.textContent = data.man_ky_du_kien;
                } else if (soKyInt > 0) {
                    manKyDuKienEl.textContent = calculateKyDate(ngayMo, soKyInt, data);
                }
            }

            // 2. DUYỆT TỪNG DÒNG CHÂN HỤI
            data.danh_sach_chan.forEach((chan, index) => {
                const stt = index + 1;
                const statusText = chan.status; 
                let statusClass = 'dead'; 
                let kyHienThi = chan.ky || ""; 
                let ngayHienThi = chan.ngay; 
                const kyThucTe = parseInt(chan.ky) || stt;

                if (statusText === 'V' || statusText === 'S') {
                    statusClass = 'alive'; 
                    if (!chan.ky || chan.ky === "") {
                        kyHienThi = ""; 
                    }
                    if (!ngayHienThi || ngayHienThi === "") {
                        ngayHienThi = calculateKyDate(ngayMo, kyThucTe, data);
                    }
                } else if (statusText === 'C') {
                    statusClass = 'c-status'; 
                }
                
                const ngayClass = (statusText === 'V' || statusText === 'S') ? '' : 'text-red';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${stt}</td>
                    <td style="text-align: left;">${chan.ten_hui_vien}</td>
                    <td class="status-cell ${statusClass}">${statusText}</td>
                    <td class="${ngayClass} font-bold">${ngayHienThi || ''}</td>
                    <td>${kyHienThi}</td> 
                    <td>${formatCurrency(chan.tham)}</td>
                    <td>${formatCurrency(chan.tien_dong)}</td>
                    <td class="text-red font-bold">${formatCurrency(chan.tien_hot)}</td>
                `;
                tbody.appendChild(row);
                tongTham += chan.tham || 0;
                tongTienHot += chan.tien_hot || 0;
                tongTienDong += chan.tien_dong || 0;
            });
        }
        
        const totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
            <td colspan="5" style="text-align: center; font-size: 14pt;">TỔNG:</td>
            <td class="text-blue">${formatTotalCurrency(tongTham)}</td>
            <td>${formatTotalCurrency(tongTienDong)}</td> 
            <td class="text-red">${formatTotalCurrency(tongTienHot)}</td>
        `;
        tbody.appendChild(totalRow);
        
        const billElement = document.getElementById('bill-to-capture');
        document.querySelector('.download-btn').addEventListener('click', () => downloadBillAsImage(billElement));
        document.querySelector('.copy-btn').addEventListener('click', () => copyBillAsImage(billElement));
        document.querySelector('.share-btn').addEventListener('click', () => shareBillAsImage(billElement));
    }

    async function captureBill(element, callback) {
        const controls = element.querySelector('.bill-controls');
        if (controls) controls.style.display = 'none';
        await new Promise(resolve => setTimeout(resolve, 500));
        try {
            const canvas = await html2canvas(element, { scale: 1.5, useCORS: true, allowTaint: false });
            await callback(canvas);
        } catch (error) {
            console.error('Lỗi khi tạo ảnh:', error);
            alert('Đã có lỗi xảy ra khi tạo ảnh. Vui lòng thử lại.');
        } finally {
            if (controls) controls.style.display = 'flex';
        }
    }

    function downloadBillAsImage(element) {
        const filename = `ThongTinDay_${billData.day_ten || 'bill'}.png`;
        captureBill(element, canvas => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function copyBillAsImage(element) {
        captureBill(element, canvas => {
            canvas.toBlob(blob => {
                try {
                    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                    .then(() => alert('Đã sao chép ảnh vào bộ nhớ tạm!'))
                    .catch(err => alert('Lỗi khi copy. Trình duyệt của bạn có thể không hỗ trợ.'));
                } catch (e) {
                    alert('Trình duyệt không hỗ trợ chức năng copy trực tiếp ảnh.');
                }
            });
        });
    }

    async function shareBillAsImage(element) {
        const filename = `ThongTinDay_${billData.day_ten || 'bill'}.png`;
        const textshare = `Thông tin dây hụi ${billData.day_ten}.`;
        const shareBtn = document.querySelector('.share-btn');
        const originalText = shareBtn.textContent;
        shareBtn.textContent = "⏳ Đang tạo...";
        shareBtn.disabled = true;

        if (!navigator.share) {
            alert('Trình duyệt không hỗ trợ chức năng này. Vui lòng dùng nút "Copy Bill" hoặc "Tải Bill".');
            shareBtn.textContent = originalText;
            shareBtn.disabled = false;
            return;
        }

        captureBill(element, async canvas => {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                if (!blob) throw new Error("Không tạo được ảnh");
                const file = new File([blob], filename, { type: 'image/png' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ title: `Thông Tin Dây Hụi`, text: textshare, files: [file] });
                } else {
                    alert('Điện thoại này chặn gửi ảnh trực tiếp. Hệ thống sẽ tự động TẢI BILL về máy, bạn mở thư viện ảnh để gửi nhé!');
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                }
            } catch (error) { 
                if (error.name !== 'AbortError' && !error.message.includes('Share API')) {
                    console.error('Lỗi Share:', error);
                    alert("Điện thoại xử lý quá lâu. Vui lòng sử dụng nút TẢI BILL.");
                }
            } finally {
                shareBtn.textContent = originalText;
                shareBtn.disabled = false;
            }
        });
    }
</script>
</body>
</html>
