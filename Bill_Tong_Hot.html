<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Hốt Hụi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            font-size: 13pt;
            font-weight: bold;
        }
        .container {
            width: 32cm; /* Mở rộng chiều ngang để vừa 8 cột */
            padding: 1cm;
            margin: auto;
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            position: relative;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14pt;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .title-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .title-section h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 28pt;
            color: #BF7D0D;
            margin: 0;
        }
        .title-section p {
            margin: 5px 0 0;
            font-size: 13pt;
            font-style: italic;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12pt;
        }
        th, td {
            border: 1px solid #adb5bd;
            padding: 8px 6px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #d9e2f3;
            font-weight: bold;
            color: #000;
        }
        tr:nth-child(even) td {
            background-color: #f8f9fa;
        }
        tr.total-row td {
            background-color: #fce4d6;
            font-weight: bold;
            font-size: 13pt;
        }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .text-center { text-align: center; }
        .text-red { color: #d90000; }
        .text-blue { color: #0044cc; }

        .bill-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .bill-controls button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .download-btn { background-color: #0275d8; } 
        .copy-btn { background-color: #5bc0de; } 
        .share-btn { background-color: #5cb85c; } 
        @media print {
            .bill-controls { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container" id="bill-container">
        <div class="header">
            <div class="header-left">Chủ Hụi: <span id="chu-hui-ten"></span></div>
            <div class="header-right">SĐT: <span id="chu-hui-sdt"></span></div>
        </div>
        <div class="title-section">
            <h1>DANH SÁCH HỐT HỤI</h1>
            <p>Ngày in: <span id="ngay-in-bill"></span></p>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 4%;">STT</th>
                    <th style="width: 18%;" class="text-left">DÂY HỤI</th>
                    <th style="width: 6%;">KỲ</th>
                    <th style="width: 11%;">NGÀY HỐT</th>
                    <th style="width: 17%;" class="text-left">HỤI VIÊN</th>
                    <th style="width: 14%;" class="text-right">TIỀN HỤI</th>
                    <th style="width: 14%;" class="text-right">THĂM KÊU</th>
                    <th style="width: 16%;" class="text-right">TIỀN HỐT</th>
                </tr>
            </thead>
            <tbody id="details-tbody"></tbody>
        </table>
        
        <div class="bill-controls">
            <button class="download-btn">Tải Bill</button>
            <button class="copy-btn">Copy Bill</button>
            <button class="share-btn">Gửi Bill</button>
        </div>
    </div>

<script>
    let billData = {}; 

    function formatCurrency(num) {
        if (typeof num !== 'number' || num === null || isNaN(num)) return '0';
        return num.toLocaleString('vi-VN');
    }

    function generateBill(data) {
        billData = data;

        document.getElementById('chu-hui-ten').textContent = data.chu_hui || '';
        document.getElementById('chu-hui-sdt').textContent = data.sdt || '';
        
        const today = new Date();
        const dateStr = String(today.getDate()).padStart(2, '0') + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();
        document.getElementById('ngay-in-bill').textContent = data.ngay_in || dateStr;
        
        const tbody = document.getElementById('details-tbody');
        tbody.innerHTML = '';

        let tongTienHui = 0;
        let tongThamKeu = 0;
        let tongTienHot = 0;

        if (data.danh_sach && Array.isArray(data.danh_sach) && data.danh_sach.length > 0) {
            data.danh_sach.forEach((item, index) => {
                const row = document.createElement('tr');
                
                const tienHui = parseFloat(item.tien_hui) || 0;
                const thamKeu = parseFloat(item.tham_keu) || 0;
                const tienHot = parseFloat(item.tien_hot) || 0;

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="text-left">${item.day_hui || ''}</td>
                    <td>${item.ky || ''}</td>
                    <td>${item.ngay_hot || ''}</td>
                    <td class="text-left">${item.hui_vien || ''}</td>
                    <td class="text-right">${formatCurrency(tienHui)}</td>
                    <td class="text-right text-red">${formatCurrency(thamKeu)}</td>
                    <td class="text-right text-blue">${formatCurrency(tienHot)}</td>
                `;
                tbody.appendChild(row);

                tongTienHui += tienHui;
                tongThamKeu += thamKeu;
                tongTienHot += tienHot;
            });
            
            // Dòng tổng kết
            const totalRow = document.createElement('tr');
            totalRow.className = 'total-row';
            totalRow.innerHTML = `
                <td colspan="5" style="background-color: rgb(217, 0, 0); color: white; text-align: center;">TỔNG CỘNG TẤT CẢ</td>
                <td class="text-right">${formatCurrency(tongTienHui)}</td>
                <td class="text-right text-red">${formatCurrency(tongThamKeu)}</td>
                <td class="text-right text-blue">${formatCurrency(tongTienHot)}</td>
            `;
            tbody.appendChild(totalRow);

        } else {
            tbody.innerHTML = `<tr><td colspan="8">Không có dữ liệu hốt hụi.</td></tr>`;
        }

        const billElement = document.getElementById('bill-container');
        document.querySelector('.download-btn').addEventListener('click', () => downloadBillAsImage(billElement));
        document.querySelector('.copy-btn').addEventListener('click', () => copyBillAsImage(billElement));
        document.querySelector('.share-btn').addEventListener('click', () => shareBillAsImage(billElement));
    }

    window.onload = function() {
        try {
            const encodedData = window.location.hash.substring(1);
            if (!encodedData) {
                generateBill({});
                return;
            }
            const jsonData = decodeURIComponent(encodedData);
            const billDataLocal = JSON.parse(jsonData);
            generateBill(billDataLocal);
        } catch (error) {
            document.body.innerHTML = `<h2 style="color: red; text-align: center;">Lỗi tải dữ liệu!</h2>`;
        }
    };

    async function captureBill(element, callback) {
        const controls = element.querySelector('.bill-controls');
        if (controls) controls.style.display = 'none';
        try {
            const canvas = await html2canvas(element, { scale: 2, useCORS: true });
            await callback(canvas);
        } catch (error) {
            alert('Lỗi tạo ảnh');
        } finally {
            if (controls) controls.style.display = 'flex';
        }
    }

    function downloadBillAsImage(element) {
        captureBill(element, canvas => {
            const link = document.createElement('a');
            link.download = `DanhSachHotHui.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function copyBillAsImage(element) {
        captureBill(element, canvas => {
            canvas.toBlob(blob => {
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                .then(() => alert('Đã copy ảnh vào clipboard!'))
                .catch(err => alert('Lỗi khi copy ảnh.'));
            });
        });
    }

    async function shareBillAsImage(element) {
        if (!navigator.share) { alert('Trình duyệt không hỗ trợ Web Share API.'); return; }
        captureBill(element, async canvas => {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const file = new File([blob], 'DanhSachHotHui.png', { type: 'image/png' });
            try { await navigator.share({ title: `Danh Sách Hốt Hụi`, files: [file] }); } catch (error) {}
        });
    }
</script>
</body>
</html>
